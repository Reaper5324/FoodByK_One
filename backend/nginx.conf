server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    # Block access to sensitive backend folders
    location ~* ^/(config|controllers|core|database|middleware|models|services|vendor)(/|$) {
        deny all;
        return 403;
    }

    location ~* ^/(\.env|bootstrap\.php|composer\.(json|lock))$ {
        deny all;
        return 403;
    }

    # Serve uploaded files directly
    location /uploads/ {
        try_files $uri =404;
    }

    # SPA/API routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_index index.php;

        # Official php:8.3-fpm image listens on TCP port 9000
        fastcgi_pass 127.0.0.1:9000;
    }

    # Security
    location ~ /\. {
        deny all;
    }
}