<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Food by K</title>
  <link rel="stylesheet" href="../../public%20assets/css/style.css">
  <link rel="stylesheet" href="../../public%20assets/css/home.css">
  <link rel="stylesheet" href="../../public%20assets/css/checkout.css">
  <link rel="stylesheet" href="../../public%20assets/css/skeletons.css">
</head>
<body class="home-page checkout-page-shell">
<header class="navbar">
  <div class="logo"><a href="../../src/index.html">FOOD<span>BY K</span></a></div>
  <nav aria-label="Main navigation">
    <a href="../../src/index.html">Home</a>
    <a href="menu.html">Menu</a>
    <a href="cart.html">Cart</a>
    <a href="../../src/index.html#contact">Contact</a>
    <a href="../auth/login.html" class="nav-auth-action">Login</a>
    <a href="../auth/register.html" class="nav-register nav-auth-action">Register</a>
  </nav>
</header>

<main class="checkout-page">
  <header class="checkout-heading">
    <p class="section-tag">Fresh food, nearly yours</p>
    <h1>Checkout<span>.</span></h1>
    <p>Choose collection or delivery, pick a time, and review your total before secure card setup.</p>
  </header>
  <div id="checkoutMessage" class="checkout-message" role="status" aria-live="polite" hidden></div>

  <form id="checkoutForm" class="checkout-form">
    <label class="checkout-field" for="fulfilmentType">Fulfilment
      <select id="fulfilmentType" required>
        <option value="collection">Collection</option>
        <option value="delivery">Delivery</option>
      </select>
    </label>
    <label id="addressField" class="checkout-field" for="addressId" hidden>Delivery address
      <select id="addressId" aria-busy="true"><option value="">Loading saved addresses…</option></select>
    </label>
    <section class="checkout-time-panel" aria-labelledby="checkoutTimeTitle">
      <div class="checkout-panel-heading">
        <p class="checkout-panel-kicker">Set your fulfilment time</p>
        <h2 id="checkoutTimeTitle">Choose a time</h2>
        <p>Available collection and delivery slots update for the date you select.</p>
      </div>
      <div class="checkout-time-fields">
        <label class="checkout-field" for="slotDate">Date
          <input id="slotDate" type="date" required>
        </label>
        <label class="checkout-field" for="slotSelect">Available time
          <select id="slotSelect" required aria-busy="true"><option value="">Loading available times…</option></select>
        </label>
      </div>
    </section>
    <label class="checkout-field checkout-promotion-field" for="promotionCode">Promotion code (optional)
      <input id="promotionCode" type="text" maxlength="50" autocomplete="off">
    </label>
    <button id="previewButton" class="btn btn-secondary checkout-review-button" type="button">Review total <span aria-hidden="true">→</span></button>
    <section id="checkoutSummary" class="checkout-summary" hidden aria-live="polite"></section>
    <button id="submitButton" class="btn btn-primary checkout-submit-button" type="submit" hidden>Continue to secure card setup <span aria-hidden="true">→</span></button>
  </form>
</main>

<script src="../../public%20assets/js/config.js"></script>
<script src="../../public%20assets/js/api/api.js"></script>
<script src="../../public%20assets/js/api/auth.js"></script>
<script src="../../public%20assets/js/navigation.js"></script>
<script src="../../public%20assets/js/checkout.js"></script>
</body>
</html>
