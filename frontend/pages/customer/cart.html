<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart | Food by K</title>
  <link rel="stylesheet" href="../../public%20assets/css/style.css">
  <link rel="stylesheet" href="../../public%20assets/css/home.css">
  <link rel="stylesheet" href="../../public%20assets/css/cart.css">
</head>
<body class="home-page cart-page-shell">
<header class="navbar">
  <div class="logo"><a href="../../src/index.html">FOOD<span>BY K</span></a></div>
  <nav aria-label="Main navigation">
    <!-- Home -->
    <a href="../../src/index.html">
      Home
    </a>
    <!-- Menu -->
    <a href="menu.html">
      Menu
    </a>
    <!-- Contact -->
    <a href="../../src/index.html#contact">
      Contact
    </a>
    <!-- Cart -->
    <a href="cart.html" class="active" aria-current="page">
      Cart
    </a>
    <a href="../auth/login.html" class="nav-auth-action">Login</a>
    <a href="../auth/register.html" class="nav-register nav-auth-action">Register</a>
  </nav>
</header>

<main class="cart-page">
  <header class="cart-heading">
    <div>
      <p class="section-tag">Good choices so far</p>
      <h1>Your <span>cart.</span></h1>
      <p>Check your picks, adjust quantities, and get ready to choose a time.</p>
    </div>
    <a class="btn btn-secondary cart-browse-link" href="menu.html">Back to menu <span aria-hidden="true">→</span></a>
  </header>
  <div id="cartMessage" class="cart-message" role="status" aria-live="polite">Loading your cart…</div>
  <section id="cartItems" aria-live="polite"></section>
  <p id="cartTotal" class="cart-total" hidden></p>
  <div class="cart-actions">
    <a id="continueShopping" class="btn btn-secondary" href="menu.html">Continue shopping</a>
    <a id="checkoutLink" class="btn btn-primary" href="checkout.html" hidden>Proceed to checkout <span aria-hidden="true">→</span></a>
  </div>
</main>

<script src="../../public%20assets/js/config.js"></script>
<script src="../../public%20assets/js/api/api.js"></script>
<script src="../../public%20assets/js/api/auth.js"></script>
<script src="../../public%20assets/js/navigation.js"></script>
<script src="../../public%20assets/js/cart.js"></script>
</body>
</html>
