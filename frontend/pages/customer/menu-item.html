<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Menu item | Food by K</title>
  <link rel="stylesheet" href="../../public%20assets/css/style.css">
  <link rel="stylesheet" href="../../public%20assets/css/home.css">
  <link rel="stylesheet" href="../../public%20assets/css/menu.css">

<body class="home-page menu-page-shell menu-item-page-shell">
  <header class="navbar">
    <div class="logo"><a href="../../src/index.html">FOOD<span>BY K</span></a></div>
    <nav aria-label="Main navigation">
      <a href="../../src/index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="cart.html">Cart</a>
      <a href="../../src/index.html#contact">Contact</a>

  <main class="menu-item-page">
    <a class="menu-item-back" href="menu.html">Back to menu</a>
    <div id="menuItemMessage" class="menu-message" role="status" aria-live="polite" hidden></div>
    <article id="menuItemDetail" class="menu-item-detail" aria-busy="true">
      <div class="menu-item-media skeleton skeleton-media" aria-hidden="true"></div>
      <div class="menu-item-copy">

        <div class="skeleton skeleton-line" aria-hidden="true"></div>
        <div class="skeleton skeleton-line menu-item-skeleton-short" aria-hidden="true"></div>
        <div class="skeleton skeleton-line menu-item-skeleton-price" aria-hidden="true"></div>
        <button class="btn btn-primary" type="button" disabled>Loading item...</button>
      </div>
    </article>
    <p id="menuItemSupportLink" class="support-context-link" hidden></p>
  </main>

  <script src="../../public%20assets/js/config.js"></script>
  <script src="../../public%20assets/js/api/api.js"></script>
