<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu | Food by K</title>
  <link rel="stylesheet" href="../../public%20assets/css/style.css">
  <link rel="stylesheet" href="../../public%20assets/css/home.css">
  <link rel="stylesheet" href="../../public%20assets/css/menu.css">
  <link rel="stylesheet" href="../../public%20assets/css/skeletons.css">
</head>
<body class="home-page menu-page-shell">
<header class="navbar">
  <div class="logo"><a href="../../src/index.html">FOOD<span>BY K</span></a></div>


  <nav aria-label="Main navigation">

    <!-- Home -->
    <a href="../../src/index.html">
      Home
    </a>

    <!-- Menu -->
    <a href="menu.html" class="active" aria-current="page">
      Menu
    </a>

    <!-- Contact -->
    <a href="../../src/index.html#contact">
      Contact
    </a>

    <!-- Cart -->
    <a href="cart.html">
      Cart
    </a>

    <a href="../auth/login.html" class="nav-auth-action">Login</a>
    <a href="../auth/register.html" class="nav-register nav-auth-action">Register</a>

  </nav>


</header>

<main class="menu-page">
  <header class="menu-header">
    <div>
      <p class="section-tag">Made fresh for you</p>
      <h1>Our <span>menu.</span></h1>
      <p>Fresh food made for your next order.</p>
    </div>
    <a class="btn btn-secondary menu-cart-link" href="cart.html">View cart <span aria-hidden="true">→</span></a>
  </header>

  <div class="menu-toolbar">
    <form id="menuSearchForm" class="menu-search" role="search">
      <input id="menuSearch" type="search" placeholder="Search burgers, fries, wings..." aria-label="Search menu">
      <button class="btn btn-primary" type="submit">Search</button>
    </form>
  <div id="categoryList" class="category-list" aria-label="Menu categories" aria-busy="true"></div>
  </div>

  <div id="menuMessage" class="menu-message" role="status" aria-live="polite" hidden></div>
  <section id="menuGrid" class="menu-grid" aria-live="polite" aria-busy="true"></section>
</main>

<dialog class="order-thanks" id="orderThanksModal" aria-labelledby="orderThanksTitle">
  <div class="order-thanks-content">
    <p class="order-thanks-kicker">Food by K says thank you</p>
    <h2 id="orderThanksTitle">Thank you for ordering!</h2>
    <p>We hope you enjoy your day and every bite.</p>
    <a class="btn btn-primary" href="menu.html">Browse the menu</a>
    <button class="order-thanks-close" id="closeOrderThanks" type="button">Close</button>
  </div>
</dialog>

<script src="../../public%20assets/js/config.js"></script>
<script src="../../public%20assets/js/api/api.js"></script>
<script src="../../public%20assets/js/api/auth.js"></script>
<script src="../../public%20assets/js/auth.js"></script>
<script src="../../public%20assets/js/navigation.js"></script>
<script src="../../public%20assets/js/menu.js"></script>
</body>
</html>
