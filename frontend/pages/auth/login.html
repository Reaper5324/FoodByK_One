<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Food by K</title>

    <!-- Shared website styling -->
    <link rel="stylesheet"
          href="../../public assets/css/style.css">

    <!-- Authentication styling -->
    <link rel="stylesheet"
          href="../../public assets/css/auth.css">

</head>


<body class="auth-page">


<main class="auth-container">


    <!-- =========================================
         FOOD BY K BRAND / IMAGE
         ========================================= -->

    <div class="auth-brand">

        <a href="../../src/index.html">
            FOOD<span>BY K</span>
        </a>

        <p>
            food.love.soul
        </p>

    </div>


    <!-- =========================================
         LOGIN CARD
         ========================================= -->

    <section class="auth-card">


        <!-- Small editorial label -->

        <p class="auth-tag">
            ACCOUNT ACCESS
        </p>


        <!-- Heading -->

        <h1>
            Welcome
            <br>
            Back
        </h1>


        <!-- Supporting text -->

        <p class="auth-subtitle">
            Log in to your Food by K account
            to continue.
        </p>


        <!-- =========================================
             ERROR / SUCCESS MESSAGES
             ========================================= -->

        <div id="message"></div>


        <!-- =========================================
             LOGIN FORM
             ========================================= -->

        <form id="loginForm">


            <!-- Email -->

            <div class="form-group">

                <label for="loginEmail">
                    Email Address
                </label>

                <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                >

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="loginPassword">
                    Password
                </label>

                <input
                        type="password"
                        id="loginPassword"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                >

            </div>


            <!-- =========================================
                 REMEMBER ME / FORGOT PASSWORD
                 ========================================= -->

            <div class="form-options">


                <label class="remember-me">

                    <input
                            type="checkbox"
                            id="rememberMe"
                    >

                    Remember me

                </label>


                <a href="forgot-password.html">
                    Forgot Password?
                </a>


            </div>


            <!-- =========================================
                 LOGIN BUTTON
                 ========================================= -->

            <button
                    type="submit"
                    class="btn btn-primary auth-btn"
            >
                Login
            </button>


        </form>


        <!-- =========================================
             REGISTRATION LINK
             ========================================= -->

        <div class="auth-footer">

            <p>
                Don't have an account?
                <a href="register.html">
                    Create an account
                </a>
            </p>

        </div>


    </section>


</main>


<!-- =========================================
     AUTHENTICATION JAVASCRIPT
     ========================================= -->

<!-- API Configuration -->
<script src="../../public assets/js/config.js"></script>

<!-- Central API Client -->
<script src="../../public assets/js/api/api.js"></script>

<!-- Authentication API Service -->
<script src="../../public assets/js/api/auth.js"></script>

<!-- Authentication Page Logic -->
<script src="../../public assets/js/auth.js"></script>


</body>

</html>
