<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#201b18">
    <title>Verify your email | Food by K</title>
    <style>
        :root { color-scheme: light; font-family: Inter, Arial, sans-serif; background: #f6f2ee; color: #28221e; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
        main { width: min(100%, 480px); padding: clamp(24px, 6vw, 42px); border: 1px solid #eadfd6; border-radius: 22px; background: #fff; box-shadow: 0 18px 55px rgba(45, 30, 20, .10); }
        .brand { margin: 0 0 8px; color: #bf4d26; font-size: .78rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
        h1 { margin: 0 0 12px; font-size: clamp(1.7rem, 6vw, 2.2rem); }
        p { color: #6a625d; line-height: 1.6; }
        #verifyMessage { min-height: 3em; }
        #verifyMessage[data-state="error"] { color: #a02f25; }
        #verifyMessage[data-state="success"] { color: #24643b; }
        a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; margin-top: 10px; padding: 0 20px; border-radius: 12px; background: #bf4d26; color: #fff; font-weight: 700; text-decoration: none; }
        a:focus-visible { outline: 3px solid #25201c; outline-offset: 3px; }
    </style>
</head>
<body>
<main>
    <p class="brand">Food by K · Account security</p>
    <h1>Verify your email</h1>
    <p id="verifyMessage" role="status" aria-live="polite">Checking your verification link…</p>
    <a id="loginLink" href="login.html" hidden>Continue to login</a>
</main>
<script src="../../public%20assets/js/config.js"></script>
<script src="../../public%20assets/js/api/api.js"></script>
<script src="../../public%20assets/js/api/auth.js"></script>
<script>
    (async () => {
        const message = document.getElementById("verifyMessage");
        const loginLink = document.getElementById("loginLink");
        const token = new URLSearchParams(location.search).get("token") || "";
        history.replaceState(null, "", location.pathname);
        if (!token) {
            message.dataset.state = "error";
            message.textContent = "This verification link is missing its token. Request a new link from the login page.";
            loginLink.hidden = false;
            return;
        }
        try {
            const result = await verifyEmail(token);
            message.dataset.state = result.success ? "success" : "error";
            message.textContent = result.success
                ? "Your email is verified. You can now sign in to your customer account."
                : (result.error || "This verification link is invalid or has expired.");
            loginLink.hidden = false;
        } catch (_) {
            message.dataset.state = "error";
            message.textContent = "We could not verify your email right now. Please try again later.";
            loginLink.hidden = false;
        }
    })();
</script>
</body>
</html>
