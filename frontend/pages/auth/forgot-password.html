<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Food by K</title>

    <!-- Shared Website Styling -->
    <link rel="stylesheet"
          href="../../public assets/css/style.css">

    <!-- Authentication Styling -->
    <link rel="stylesheet"
          href="../../public assets/css/auth.css">

</head>


<body class="auth-page">


<div class="auth-container">


    <!-- =========================================
         FOOD BY K BRAND / IMAGE
    ========================================== -->

    <div class="auth-brand">

        <a href="../../src/index.html">
            FOOD<span>BY K</span>
        </a>

        <p>
            food.love.soul
        </p>

    </div>


    <!-- =========================================
         FORGOT PASSWORD CARD
    ========================================== -->

    <div class="auth-card">

        <p class="auth-tag">
            ACCOUNT RECOVERY
        </p>


        <h1>
            Forgot Your
            <br>
            Password?
        </h1>


        <p class="auth-subtitle">
            Enter your email address and we'll
            help you reset your password.
        </p>


        <!-- Message -->

        <div id="message"></div>


        <!-- Forgot Password Form -->

        <form id="forgotPasswordForm">


            <div class="form-group">

                <label for="forgotEmail">
                    Email Address
                </label>

                <input
                        type="email"
                        id="forgotEmail"
                        name="email"
                        placeholder="Enter your email address"
                        required
                >

            </div>


            <!-- Submit Button -->

            <button
                    type="submit"
                    class="btn btn-primary auth-btn">

                Send Reset Instructions

            </button>


        </form>


        <!-- Back To Login -->

        <div class="auth-footer">

            <p>

                Remember your password?

                <a href="login.html">
                    Back to Login
                </a>

            </p>

        </div>

    </div>


</div>


<!-- =========================================
     API CONFIGURATION
========================================== -->

<script src="../../public assets/js/config.js"></script>


<!-- =========================================
     API LAYER
========================================== -->

<script src="../../public assets/js/api/api.js"></script>


<!-- =========================================
     AUTHENTICATION API
========================================== -->

<script src="../../public assets/js/api/auth.js"></script>


<!-- =========================================
     AUTHENTICATION PAGE LOGIC
========================================== -->

<script src="../../public assets/js/auth.js"></script>


</body>
</html>
