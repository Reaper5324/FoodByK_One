<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>My Account | Food by K</title>


    <!-- Shared Website Styling -->
    <link
            rel="stylesheet"
            href="../../public assets/css/style.css"
    >

    <!-- Authentication Styling -->
    <link
            rel="stylesheet"
            href="../../public assets/css/auth.css"
    >

</head>


<body>

<header class="navbar" id="navigation">
    <div class="logo"><a href="../../src/index.html">FOOD<span>BY K</span></a></div>
    <nav aria-label="Main navigation">
        <a href="../../src/index.html">Home</a>
        <a href="../customer/menu.html">Menu</a>
        <a href="../customer/cart.html">Cart</a>
        <a href="../../src/index.html#contact">Contact</a>
        <a href="login.html" class="nav-auth-action">Login</a>
        <a href="register.html" class="nav-register nav-auth-action">Register</a>
    </nav>
</header>


<main class="account-page">

    <section class="account-container">


        <!-- =========================================
             PAGE HEADING
             ========================================= -->

        <div class="account-header">

            <h1>
                My Account
            </h1>

            <p>
                View and manage your Food by K account.
            </p>

        </div>


        <!-- =========================================
             ACCOUNT INFORMATION
             ========================================= -->

        <section class="account-card">

            <h2>
                Account Information
            </h2>


            <!-- User Information -->

            <div class="account-info">


                <div class="account-field">

                        <span class="account-label">
                            First Name
                        </span>

                    <span
                            id="accountFirstName"
                            class="account-value"
                    >
                            Loading...
                        </span>

                </div>


                <div class="account-field">

                        <span class="account-label">
                            Last Name
                        </span>

                    <span
                            id="accountLastName"
                            class="account-value"
                    >
                            Loading...
                        </span>

                </div>


                <div class="account-field">

                        <span class="account-label">
                            Email Address
                        </span>

                    <span
                            id="accountEmail"
                            class="account-value"
                    >
                            Loading...
                        </span>

                </div>


            </div>


            <!-- Account Actions -->

            <div class="account-actions">

                <button
                        type="button"
                        id="logoutButton"
                        class="btn btn-primary"
                >
                    Logout
                </button>

            </div>


        </section>



        <!-- =========================================
             CHANGE PASSWORD
             ========================================= -->

        <section class="account-card">

            <h2>
                Change Password
            </h2>


            <!-- Password Messages -->

            <div id="passwordMessage"></div>


            <form id="changePasswordForm">


                <!-- Current Password -->

                <div class="form-group">

                    <label for="currentPassword">
                        Current Password
                    </label>

                    <input
                            type="password"
                            id="currentPassword"
                            name="current_password"
                            placeholder="Enter your current password"
                            autocomplete="current-password"
                            required
                    >

                </div>


                <!-- New Password -->

                <div class="form-group">

                    <label for="newPassword">
                        New Password
                    </label>

                    <input
                            type="password"
                            id="newPassword"
                            name="new_password"
                            placeholder="Enter your new password"
                            autocomplete="new-password"
                            required
                    >

                </div>


                <!-- Confirm New Password -->

                <div class="form-group">

                    <label for="confirmNewPassword">
                        Confirm New Password
                    </label>

                    <input
                            type="password"
                            id="confirmNewPassword"
                            name="confirm_new_password"
                            placeholder="Confirm your new password"
                            autocomplete="new-password"
                            required
                    >

                </div>


                <!-- Submit -->

                <button
                        type="submit"
                        class="btn btn-primary"
                >
                    Change Password
                </button>


            </form>

        </section>


    </section>

</main>



<!-- =========================================
     JAVASCRIPT
     ========================================= -->

<!-- API Configuration -->
<script src="../../public%20assets/js/config.js"></script>

<!-- Central API Client -->
<script src="../../public%20assets/js/api/api.js"></script>

<!-- Authentication API Service -->
<script src="../../public%20assets/js/api/auth.js"></script>

<!-- Navigation -->
<script src="../../public assets/js/navigation.js"></script>

<!-- Authentication Page Logic -->
<script src="../../public assets/js/auth.js"></script>

</body>

</html>
