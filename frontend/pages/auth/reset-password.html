<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Food by K</title>

    <!-- Shared website styling -->
    <link rel="stylesheet"
          href="../../public assets/css/style.css">

    <!-- Authentication styling -->
    <link rel="stylesheet"
          href="../../public assets/css/auth.css">

</head>

<body class="auth-page">

<div class="auth-container">

    <!-- Food by K Branding -->

    <div class="auth-brand">

        <a href="../../src/index.html">
            FOOD<span>BY K</span>
        </a>

    </div>


    <!-- Reset Password Card -->

    <div class="auth-card">

        <h1>
            Reset Your Password
        </h1>

        <p class="auth-subtitle">

            Enter your new password below.

        </p>


        <!-- Message -->

        <div id="message"></div>


        <!-- Reset Password Form -->

        <form id="resetPasswordForm" novalidate>

            <!-- New Password -->

            <div class="form-group">

                <label for="newPassword">
                    New Password
                </label>

                <input
                        type="password"
                        id="newPassword"
                        name="password"
                        placeholder="Enter your new password"
                        required
                >

            </div>


            <!-- Confirm Password -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm New Password
                </label>

                <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your new password"
                        required
                >

            </div>


            <!-- Reset Button -->

            <button
                    type="submit"
                    class="btn btn-primary auth-btn">

                Reset Password

            </button>

        </form>


        <!-- Back to Login -->

        <div class="auth-footer">

            <p>

                Remember your password?

                <a href="login.html">
                    Back to Login
                </a>

            </p>

        </div>

    </div>

</div>


<!-- API Configuration -->

<script src="../../public%20assets/js/config.js"></script>


<!-- API Layer -->

<script src="../../public%20assets/js/api/api.js"></script>


<!-- Authentication API -->

<script src="../../public%20assets/js/api/auth.js"></script>


<!-- Authentication Page Logic -->

<script src="../../public assets/js/auth.js"></script>

</body>

</html>
